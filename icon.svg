<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Persona">
  <!-- Persona: a mask, the plainest mark for "the character you are talking to".
       Two eye cutouts are genuine holes (evenodd), so the tile shows through. -->
  <path fill="#7C6BD6" fill-rule="evenodd" d="M18 5.5c-5.6 0-9.9 1.1-9.9 1.1-1.1.2-1.9 1.2-1.9 2.3v8.4c0 6.6 5.3 12 11.8 12s11.8-5.4 11.8-12V8.9c0-1.1-.8-2.1-1.9-2.3 0 0-4.3-1.1-9.9-1.1Zm-4.6 9.2a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2Zm9.2 0a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2Z"/>
  <!-- The mouth: a short arc, drawn as a stroke so it stays open at both ends. -->
  <path fill="none" stroke="#7C6BD6" stroke-width="2" stroke-linecap="round" d="M14.4 23.4c1 1.3 2.2 2 3.6 2s2.6-.7 3.6-2"/>
</svg>
