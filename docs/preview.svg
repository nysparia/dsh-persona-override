<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A selected persona card in the library feeding the persona chip of a conversation">
  <!-- No background rectangle: every shape carries its own fill and stroke, so the
       drawing reads on a light and on a dark page. No text, fonts, scripts or remote refs.
       Palette is mid-tone on purpose: strokes and marks clear 3:1 against both #FFFFFF
       and #151517, and the card fills stay visible as tints on either. -->

  <!-- Library: three persona cards, the middle one selected. -->
  <g>
    <rect x="48" y="56" width="200" height="52" rx="12" fill="#CFC8E8" stroke="#8F87B8" stroke-width="2"/>
    <circle cx="76" cy="82" r="8" fill="none" stroke="#5E4FB8" stroke-width="2"/>
    <rect x="98" y="72" width="118" height="8" rx="4" fill="#4A3E8F"/>
    <rect x="98" y="86" width="76" height="6" rx="3" fill="#5E4FB8"/>
  </g>
  <g>
    <rect x="48" y="124" width="200" height="52" rx="12" fill="#B9AEDF" stroke="#7C6BD6" stroke-width="2.5"/>
    <circle cx="76" cy="150" r="8" fill="none" stroke="#5E4FB8" stroke-width="2"/>
    <circle cx="76" cy="150" r="4.5" fill="#5E4FB8"/>
    <rect x="98" y="140" width="118" height="8" rx="4" fill="#4A3E8F"/>
    <rect x="98" y="154" width="76" height="6" rx="3" fill="#5E4FB8"/>
  </g>
  <g>
    <rect x="48" y="192" width="200" height="52" rx="12" fill="#CFC8E8" stroke="#8F87B8" stroke-width="2"/>
    <circle cx="76" cy="218" r="8" fill="none" stroke="#5E4FB8" stroke-width="2"/>
    <rect x="98" y="208" width="118" height="8" rx="4" fill="#4A3E8F"/>
    <rect x="98" y="222" width="76" height="6" rx="3" fill="#5E4FB8"/>
  </g>

  <!-- The selected card is the one the conversation runs. -->
  <path d="M256 150h76m-11-11 11 11-11 11" fill="none" stroke="#7C6BD6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Conversation: a card whose header chip names the persona in force. -->
  <rect x="352" y="84" width="240" height="132" rx="18" fill="#CFC8E8" stroke="#8F87B8" stroke-width="2"/>
  <rect x="372" y="104" width="140" height="30" rx="15" fill="#B9AEDF" stroke="#5E4FB8" stroke-width="2"/>
  <g transform="translate(384 110) scale(0.5)">
    <path fill="#5E4FB8" fill-rule="evenodd" d="M18 5.5c-5.6 0-9.9 1.1-9.9 1.1-1.1.2-1.9 1.2-1.9 2.3v8.4c0 6.6 5.3 12 11.8 12s11.8-5.4 11.8-12V8.9c0-1.1-.8-2.1-1.9-2.3 0 0-4.3-1.1-9.9-1.1Zm-4.6 9.2a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2Zm9.2 0a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2Z"/>
    <path fill="none" stroke="#B9AEDF" stroke-width="2" stroke-linecap="round" d="M14.4 23.4c1 1.3 2.2 2 3.6 2s2.6-.7 3.6-2"/>
  </g>
  <rect x="410" y="115.5" width="84" height="7" rx="3.5" fill="#4A3E8F"/>
  <path d="M372 150h200" fill="none" stroke="#6A5CA8" stroke-width="2" stroke-linecap="round"/>

  <!-- The reply now speaks as that persona. -->
  <g transform="translate(374 164) scale(0.85)">
    <path fill="#5E4FB8" fill-rule="evenodd" d="M18 5.5c-5.6 0-9.9 1.1-9.9 1.1-1.1.2-1.9 1.2-1.9 2.3v8.4c0 6.6 5.3 12 11.8 12s11.8-5.4 11.8-12V8.9c0-1.1-.8-2.1-1.9-2.3 0 0-4.3-1.1-9.9-1.1Zm-4.6 9.2a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2Zm9.2 0a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2Z"/>
    <path fill="none" stroke="#CFC8E8" stroke-width="2" stroke-linecap="round" d="M14.4 23.4c1 1.3 2.2 2 3.6 2s2.6-.7 3.6-2"/>
  </g>
  <rect x="420" y="168" width="128" height="8" rx="4" fill="#4A3E8F"/>
  <rect x="420" y="186" width="92" height="6" rx="3" fill="#5E4FB8"/>
</svg>
